name: Deploy web Docker image
on:
    push:
        branches:
            - master
        paths:
            - "web/**"
            - "core/**"
            - ".dockerignore"
            - ".github/workflows/web-docker.yml"
    workflow_dispatch:
concurrency:
    group: web-docker
    cancel-in-progress: true
jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v7
            - id: image
              run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/strautomator-web" >> "$GITHUB_OUTPUT"
            - uses: docker/setup-qemu-action@v4
            - uses: docker/setup-buildx-action@v4
            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            # Built from the repository root, as the web depends on the local core.
            # The source label and index annotation link the package to this repository.
            - uses: docker/build-push-action@v7
              with:
                  context: .
                  file: web/Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: |
                      ${{ steps.image.outputs.name }}:${{ github.sha }}
                      ${{ steps.image.outputs.name }}:latest
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                  annotations: |
                      index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      index:org.opencontainers.image.revision=${{ github.sha }}
                  cache-from: type=gha,scope=web
                  cache-to: type=gha,scope=web,mode=max
